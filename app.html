<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManageBac-Buddy</title>
<style>
:root{
  --bg:#fbfbfd;
  --card:#ffffff;
  --ink:#1d1d1f;
  --ink2:#6e6e73;
  --ink3:#86868b;
  --line:rgba(0,0,0,.08);
  --line2:rgba(0,0,0,.055);
  --accent:#0071e3;
  --red:#ff3b30;
  --amber:#ff9f0a;
  --green:#34c759;
  --blue:#007aff;
  --r-lg:24px;
  --r-md:18px;
  --r-sm:12px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px -12px rgba(0,0,0,.12);
  --shadow-h:0 2px 6px rgba(0,0,0,.06), 0 18px 40px -18px rgba(0,0,0,.2);
}

/* ---------- 顶部告警条 ----------
   存在的唯一理由：以前掉登录时看板会拿缓存里的 loggedIn 说「已连接 ManageBac」，
   于是电脑说没事、手表说掉线，用户被两个界面来回打脸。现在这里必须说真话。 */
.alert{
  display:flex;align-items:flex-start;gap:14px;
  margin:0 0 18px;padding:16px 18px;
  border-radius:var(--r-md);
  border:1px solid rgba(255,59,48,.28);
  background:linear-gradient(180deg, rgba(255,59,48,.08), rgba(255,59,48,.045));
  box-shadow:var(--shadow);
  animation:alertIn .32s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes alertIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.alert .ai{font-size:22px;line-height:1.1;flex:0 0 auto}
.alert .ab{flex:1 1 auto;min-width:0}
.alert h4{
  margin:0 0 5px;font-size:15px;font-weight:650;color:#b3261e;
  letter-spacing:-.01em;
}
.alert p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.alert p b{color:var(--ink);font-weight:600}
.alert .aa{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.alert button{
  font:inherit;font-size:13px;font-weight:600;color:#fff;cursor:pointer;
  background:var(--red);border:0;border-radius:999px;padding:9px 18px;
  white-space:nowrap;transition:filter .18s ease, transform .18s ease;
}
.alert button:hover{filter:brightness(1.06)}
.alert button:active{transform:scale(.97)}
.alert button.ghost2{
  background:transparent;color:var(--ink2);
  border:1px solid var(--line);font-weight:500;padding:7px 14px;
}
.alert button.ghost2:hover{background:rgba(0,0,0,.035)}
@media (max-width:640px){
  .alert{flex-wrap:wrap}
  .alert .aa{width:100%;flex-direction:row}
  .alert .aa button{flex:1}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em;
  min-height:100vh;
}
.wrap{max-width:1060px;margin:0 auto;padding:0 28px 96px}

/* 本地服务离线横幅 */
.svc-down{
  position:sticky;top:0;z-index:99;
  display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
  padding:12px 24px;margin:0 0 4px;
  background:rgba(255,59,48,.08);
  border-bottom:1px solid rgba(255,59,48,.22);
  color:#a3201a;font-size:14px;
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
}
.svc-down b{font-weight:600}
.svc-down .dot{
  width:8px;height:8px;border-radius:50%;background:var(--red);
  align-self:center;flex:0 0 auto;
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}


/* ---------- header ---------- */
header{padding:44px 0 8px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:4px;flex:1;min-width:260px}
.brand h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-0.035em;line-height:1.1}
.brand .sub{color:var(--ink3);font-size:13.5px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:13px;color:var(--ink2);
}
.chip b{color:var(--ink);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.dot.off{background:var(--ink3)}
.dot.warn{background:var(--amber)}
button.ghost{
  appearance:none;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:8px 16px;font-size:13.5px;color:var(--ink);cursor:pointer;font-family:inherit;
  transition:all .18s ease;
}
button.ghost:hover{background:#f5f5f7;border-color:rgba(0,0,0,.14)}
button.ghost:active{transform:scale(.97)}
button.ghost[disabled]{opacity:.45;cursor:default}

/* ---------- section ---------- */
section{margin-top:46px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sec-head h2{margin:0;font-size:25px;font-weight:700;letter-spacing:-0.03em}
.sec-head .count{color:var(--ink3);font-size:14px}

/* ---------- task grid ---------- */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(248px,1fr));
  gap:16px;
}
.task{
  position:relative;display:flex;flex-direction:column;
  background:var(--card);border-radius:var(--r-md);
  border:2px solid var(--line);
  box-shadow:var(--shadow);
  height:162px;padding:15px 17px 13px;
  text-decoration:none;color:inherit;cursor:pointer;
  transition:transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s ease, border-color .2s ease;
  overflow:hidden;
}
.task:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.task:active{transform:translateY(-1px) scale(.995)}
.task .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:9px}
.subject{
  font-size:12.5px;font-weight:600;color:var(--accent);
  letter-spacing:0;line-height:1.25;
  max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.kind{font-size:11px;color:var(--ink3);flex:none;padding-top:1px}
.title{
  flex:1;display:flex;align-items:center;
  font-weight:600;letter-spacing:-0.015em;line-height:1.25;
  word-break:break-word;overflow:hidden;
}
.title span{
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;
}
.foot{
  margin-top:auto;padding-top:10px;border-top:1px solid var(--line2);
  display:flex;flex-direction:column;gap:3px;
  font-size:11.5px;color:var(--ink3);line-height:1.35;
}
.foot .row{display:flex;justify-content:space-between;gap:8px}
.foot .k{color:var(--ink3)}
.foot .v{color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.left-flag{
  position:absolute;top:0;left:0;width:4px;height:100%;
  background:transparent;
}
.task.r-urgent{border-color:var(--red)}
.task.r-soon{border-color:var(--amber)}
.task.r-blue{border-color:var(--blue)}
.task.r-ok{border-color:var(--green)}
.task.r-over{border-color:rgba(255,59,48,.45);background:#fffafa}
.t-left{font-weight:600;font-variant-numeric:tabular-nums}
.task.r-urgent .t-left{color:var(--red)}
.task.r-soon .t-left{color:var(--amber)}
.task.r-blue .t-left{color:var(--blue)}
.task.r-ok .t-left{color:var(--green)}
.task.r-over .t-left{color:var(--red)}

/* ---------- overdue fold ---------- */
.fold{margin-top:20px}
.fold-btn{
  width:100%;display:flex;align-items:center;gap:12px;
  appearance:none;font-family:inherit;font-size:15px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
  padding:16px 20px;cursor:pointer;text-align:left;
  box-shadow:var(--shadow);transition:all .18s ease;
}
.fold-btn:hover{background:#fdfdfe;border-color:rgba(0,0,0,.14)}
.fold-btn .sw{
  width:26px;height:26px;border-radius:8px;flex:none;
  background:rgba(255,59,48,.1);color:var(--red);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.fold-btn .lbl{flex:1;display:flex;align-items:center;gap:9px;font-weight:500}
.fold-btn .lbl small{color:var(--ink3);font-weight:400;font-size:12.5px}
.fold-btn .chev{color:var(--ink3);transition:transform .25s cubic-bezier(.3,.8,.3,1);display:flex;align-items:center;flex:none}
.fold-btn .chev svg{display:block}
.fold.open .fold-btn .chev{transform:rotate(180deg)}
.fold-body{
  overflow:hidden;max-height:0;opacity:0;transition:max-height .38s cubic-bezier(.3,.8,.3,1), opacity .28s ease, margin .3s ease;
  margin-top:0;
}
.fold.open .fold-body{max-height:2200px;opacity:1;margin-top:16px}

/* ---------- schedule ---------- */
.count-card{
  background:linear-gradient(180deg,#ffffff 0%,#fcfcfe 100%);
  border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:26px 28px;margin-bottom:18px;
}
.count-label{font-size:13px;color:var(--ink3);letter-spacing:0}
.count-big{
  font-size:60px;font-weight:700;letter-spacing:-0.045em;line-height:1.05;
  font-variant-numeric:tabular-nums;margin-top:6px;
}
.count-big.rest{font-size:44px;letter-spacing:-0.02em}
.count-target{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.count-target .name{font-size:17px;font-weight:600}
.count-target .where{font-size:13px;color:var(--ink2);background:#f5f5f7;border-radius:999px;padding:3px 11px}
.progress{height:4px;border-radius:999px;background:rgba(0,0,0,.06);margin-top:18px;overflow:hidden}
.progress i{display:block;height:100%;border-radius:999px;background:var(--accent);width:0;transition:width .6s ease}
.now-line{margin-top:12px;font-size:13px;color:var(--ink3)}

.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.cls{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow);padding:18px 18px 15px;display:flex;flex-direction:column;gap:9px;
  border-top:4px solid var(--pc,var(--accent));
  transition:transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s ease;
}
.cls:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.cls .p{font-size:12px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center}
.cls .p .tt{color:var(--ink2)}
.cls .n{font-size:21px;font-weight:700;letter-spacing:-0.03em;line-height:1.15}
.cls .n.free{color:var(--ink3);font-weight:600;font-size:18px}
.cls .m{font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:3px;margin-top:auto}
.cls .m .tag{
  display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;margin-right:6px;
  background:#f5f5f7;color:var(--ink2);vertical-align:1px;
}
.cls .m .tag.walk{background:rgba(0,113,227,.09);color:var(--accent)}
.cls .m .tag.own{background:rgba(52,199,89,.12);color:#1f9c46}

/* ---------- states ---------- */
.panel{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:34px;margin-top:40px;
}
.panel h3{margin:0 0 6px;font-size:20px;font-weight:700;letter-spacing:-0.02em}
.panel p{margin:0;color:var(--ink2);font-size:14px}
.center{text-align:center;max-width:460px;margin:72px auto}
.center .icon{font-size:44px;margin-bottom:14px}
form.login{margin-top:22px;text-align:left;display:flex;flex-direction:column;gap:12px}
form.login label{font-size:13px;color:var(--ink2);margin-bottom:-6px}
form.login input{
  font-family:inherit;font-size:15px;padding:12px 14px;border-radius:12px;
  border:1px solid rgba(0,0,0,.14);background:#fff;color:var(--ink);width:100%;
  transition:border-color .18s ease, box-shadow .18s ease;
}
form.login input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px rgba(0,113,227,.14)}
form.login .cb{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);margin-top:2px}
form.login .cb input{width:auto}
.btn-primary{
  appearance:none;font-family:inherit;border:0;border-radius:999px;cursor:pointer;
  background:var(--accent);color:#fff;font-size:15px;font-weight:500;padding:13px 22px;
  transition:all .18s ease;
}
.btn-primary:hover{background:#0077ed}
.btn-primary:active{transform:scale(.98)}
.btn-primary[disabled]{opacity:.5;cursor:default}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.msg.err{color:var(--red)}
.msg.ok{color:#1f9c46}
.hint{font-size:12.5px;color:var(--ink3);margin-top:14px;line-height:1.5}
code{
  background:#f5f5f7;border-radius:6px;padding:2px 7px;font-size:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#333;
  word-break:break-all;
}
.skeleton{
  height:172px;border-radius:var(--r-md);border:1px solid var(--line2);
  background:linear-gradient(100deg,#f5f5f7 30%,#fafafa 50%,#f5f5f7 70%);
  background-size:220% 100%;animation:sk 1.4s linear infinite;
}
@keyframes sk{0%{background-position:120% 0}100%{background-position:-120% 0}}
/* ============================================================
   GPA 总览板块（新增，全部独立类名，不影响既有样式）
   ============================================================ */
.sched-click{cursor:pointer}
.gpa-panel{padding:22px 22px 20px}
.gpa-chart{
  display:grid;grid-template-columns:repeat(8,1fr);gap:10px;
  align-items:end;height:216px;padding:0 2px;
}
.gpa-col{
  display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  height:100%;text-decoration:none;color:inherit;gap:5px;border-radius:14px;
  padding:4px 2px 2px;transition:background .18s ease;
}
.gpa-col:hover{background:rgba(0,0,0,.028)}
.gpa-top{text-align:center;line-height:1.15}
.gpa-pct{font-size:15px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gpa-grade{
  display:inline-block;margin-top:2px;font-size:11.5px;font-weight:700;
  padding:1px 7px;border-radius:9px;background:rgba(0,0,0,.05);color:var(--ink2);
}
.gpa-grade.none{background:transparent;color:var(--ink3);font-weight:600}
/* 4 分制折算：与百分比同色、字号更小，紧贴等级徽章下方 */
.gpa-4{
  margin-top:3px;font-size:11px;font-weight:600;line-height:1.1;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;opacity:.92;
}
.gpa-track{
  width:100%;max-width:46px;flex:0 0 auto;height:120px;margin:2px 0 0;
  border-radius:9px;background:rgba(0,0,0,.045);overflow:hidden;
  display:flex;align-items:flex-end;position:relative;
}
.gpa-fill{width:100%;border-radius:9px;transition:height .5s cubic-bezier(.3,.8,.3,1)}
.gpa-track.empty{
  background:repeating-linear-gradient(45deg,rgba(0,0,0,.035) 0 6px,rgba(0,0,0,0) 6px 12px);
}
.gpa-name{
  font-size:12.5px;font-weight:600;color:var(--ink2);margin-top:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}

.gpa-latest{
  display:grid;grid-template-columns:repeat(8,1fr);gap:10px;
  margin-top:20px;padding-top:18px;border-top:1px solid var(--line2);
}
.hw{
  display:flex;flex-direction:column;gap:5px;text-decoration:none;color:inherit;
  background:#fbfbfd;border:1px solid var(--line2);border-radius:14px;
  padding:11px 11px 10px;min-height:106px;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.hw:hover{transform:translateY(-2px);border-color:rgba(0,0,0,.14);box-shadow:0 8px 20px rgba(0,0,0,.05)}
.hw-sub{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.02em;white-space:nowrap}
.hw-name{
  font-size:12px;font-weight:600;line-height:1.3;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;flex:1;
}
.hw-foot{display:flex;flex-direction:column;gap:3px}
.hw-due{font-size:10.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hw-score{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.hw-score .g{color:var(--green);margin-right:4px}
.hw-score .g.low{color:var(--amber)}
.hw.none{justify-content:center;align-items:center;color:var(--ink3);font-size:12px;text-align:center}

@media (max-width:900px){
  .gpa-chart{grid-template-columns:repeat(4,1fr);height:auto;gap:14px 10px}
  .gpa-track{height:96px}
  .gpa-latest{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:600px){
  .gpa-chart{grid-template-columns:repeat(4,1fr)}
  .gpa-latest{grid-template-columns:repeat(2,1fr)}
  .gpa-panel{padding:18px 14px}
}
footer{margin-top:64px;color:var(--ink3);font-size:12px;text-align:center;line-height:1.7}
@media (max-width:600px){
  .wrap{padding:0 18px 64px}
  header{padding:30px 0 6px}
  .brand h1{font-size:27px}
  .count-big{font-size:44px}
  .count-big.rest{font-size:32px}
  .grid{grid-template-columns:1fr 1fr;gap:12px}
  .task{height:156px;padding:13px 14px 12px}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>ManageBac-Buddy</h1>
      <div class="sub" id="sub">正在连接本地服务…</div>
    </div>
    <div class="meta">
      <span class="chip"><span class="dot off" id="dotStatus"></span><span id="chipStatus">连接中</span></span>
      <button class="ghost" id="btnRefresh">刷新</button>
    </div>
  </header>

  <div id="alert"></div>

  <div id="app"></div>

  <footer>
    数据来源：ManageBac · 北京101中学 &nbsp;|&nbsp; 课表依据「课表-新版」&nbsp;|&nbsp; 每次打开与刷新均实时读取
  </footer>
</div>

<script>
/* ============================================================
   1. 配置
   ============================================================ */
const API = 'http://127.0.0.1:8765';
const MB  = 'https://beijing101.managebac.cn';
const REFRESH_MS = 3 * 60 * 1000;      // 数据自动刷新间隔
const HIDE_TITLE_RE = /背诵视频/;        // 不显示的语文作业

/* 截止时间紧急度阈值（小时）：≤26 红、26–50 黄、50–74 蓝、>74 绿 */
const T_URGENT = 26, T_SOON = 50, T_BLUE = 74;

/* ============================================================
   2. 课表（源自「课表-新版」PDF）
   ============================================================ */
const PERIODS = [
  {p:'P1', s:'08:00', e:'08:40'},
  {p:'P2', s:'08:50', e:'09:30'},
  {p:'P3', s:'10:00', e:'10:40'},
  {p:'P4', s:'10:50', e:'11:30'},
  {p:'P5', s:'11:40', e:'12:20'},
  {p:'P6', s:'13:50', e:'14:30'},
  {p:'P7', s:'14:45', e:'15:25'},
  {p:'P8', s:'15:40', e:'16:20'},
];
/* 每门课颜色（对应 PDF 图例） */
const C = {
  calc:'#c355c9', phys:'#79c34a', ids:'#f0913f', eng:'#f0913f',
  pol: '#e8b93a', pe:  '#8a7be0', chem:'#7b6ce0', geo: '#8a7be0',
  his: '#6f9ce8', bio: '#3fbfa6', it:  '#3f8fe0', chi: '#e8638c',
  guide:'#93a3b8', toefl:'#a884d8', art:'#59c2b0', class_meet:'#e05a5a'
};
/* blocks: [起始节, 结束节, 科目, 教室, 教师, 模式, 颜色] —— 节次为 1..8 */
const WEEK = {
  1:[ [1,1,'AP 初级微积分','E103','李思远','走班',C.calc],
      [2,3,'高一年级英语','E101','Alan Reeve','走班',C.eng],
      [4,4,'历史','E106','周敏','本班',C.his],

/* 时间节点 */
const NIGHT_START = '18:30';   // 晚自习开始
const NIGHT_END   = '22:30';   // 晚自习结束
const WAKE        = '06:00';   // 起床

/* ============================================================
   3. 小工具
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hm(str, base){
  const [h,m] = str.split(':').map(Number);
  const d = new Date(base); d.setHours(h,m,0,0); return d;
}
function fmtClock(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDate(d){ return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function fmtDateClock(d){ return fmtDate(d)+' '+fmtClock(d); }

/* ---------- 「数据有多旧」只说数据自己的时间 ----------
   d.fetchedAt 是服务端抓回这批数据时盖的戳。
   以前抬头写的是 state.lastFetch（本次请求成功的本地时刻），于是 7 小时前的
   数据会堂堂正正写成「更新于 01:18」—— 数据不动也看不出来。 */
function dataAgeText(d){
  if(!d || !d.fetchedAt) return '未知时间';
  const s = Math.max(0, Date.now()/1000 - d.fetchedAt);
  if(s < 90) return '刚刚';
  if(s < 3600) return Math.round(s/60) + ' 分钟前';
  if(s < 86400) return (s/3600).toFixed(1) + ' 小时前';
  return Math.floor(s/86400) + ' 天前';
}
function dataClock(d){
  return (d && d.fetchedAt) ? fmtClock(new Date(d.fetchedAt*1000)) : '';
}
function humanLeft(ms){
  const s = Math.round(ms/1000);
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  if(d>0) return d+' 天 '+h+' 小时';
  if(h>0) return h+' 小时 '+m+' 分';
  if(m>0) return m+' 分钟';
  return '不到 1 分钟';
}
function hms(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  return pad(Math.floor(t/3600))+':'+pad(Math.floor(t%3600/60))+':'+pad(t%60);
}
/* 学科名精简 */
function shortSubject(s){
  let t = String(s||'')
    .replace(/\(\s*Grade\s*\d+\s*\)/ig,' ')
    .replace(/\bClass\s*\d+\b/ig,' ')
    .replace(/\d+\s*班[^\s]*/g,' ')
    .replace(/\s*\d+(\s*\+\s*\d+)+\s*/g,' ')   // 19+20+21+22 这类合班编号
    .replace(/\s*[A-Z]\d{2,4}\s*$/,' ')        // 结尾的教室号 E106 / W110
    .replace(/^AP\s+/,'')
    .replace(/\s+/g,' ')
    .trim();
  // 去掉结尾多余的单个大写字母（如 “Geography I A” → “Geography I”）
  t = t.replace(/\s+[A-Z]$/,'').trim();
  return t || '课程';
}

/* ============================================================
   4. 课表计算
   ============================================================ */
/* 把某天的课表展开成「节」数组 */
function slotsOfDay(dayIdx, dateObj){
  const blocks = WEEK[dayIdx]; if(!blocks) return [];
  const out = [];
  blocks.forEach((b,i)=>{
    for(let p=b[0]; p<=b[1]; p++){
      const P = PERIODS[p-1];
      out.push({
        blockId: dayIdx+'-'+i, dayIdx,
        period:p, pLabel:P.p,
        start: hm(P.s, dateObj), end: hm(P.e, dateObj),
        subject:b[2], room:b[3], teacher:b[4], mode:b[5], color:b[6],
        isFree: /自习/.test(b[2]),
        first: p===b[0], last: p===b[1], span:[b[0],b[1]]
      });
    }
  });
  return out;
}
/* 从 now 起，向后取 n 节课（跨天到下一个上课日） */
function upcomingSlots(now, n){
  n = n || 4;
  const out = [];
  let d = new Date(now), guard = 0;
  while(out.length < n && guard++ < 14){
    const idx = d.getDay(); // 0=周日 1=周一…6=周六
    if(WEEK[idx]){
      slotsOfDay(idx, d).forEach(s=>{
        if(s.start.getTime() > now.getTime()) out.push(s);
      });
    }
    d.setDate(d.getDate()+1);
  }
  return out.slice(0, n);
}

/* 下一节点（用于倒计时） */
function nextTarget(now){
  const t = now.getHours()*60 + now.getMinutes();
  const m = s => { const [a,b]=s.split(':').map(Number); return a*60+b; };

  // 22:30 – 次日 06:00：休息
  if(t >= m(NIGHT_END) || t < m(WAKE)) return {type:'rest'};

  // 18:30 – 22:30：距离晚自习结束
  if(t >= m(NIGHT_START) && t < m(NIGHT_END))
    return {type:'study_end', target: hm(NIGHT_END, now), label:'距离晚自习结束'};

  const todays = WEEK[now.getDay()] ? slotsOfDay(now.getDay(), now) : [];
  const rest  = todays.filter(s=>s.start.getTime() > now.getTime());
  if(rest.length) return {type:'class', target: rest[0].start, slot: rest[0], label:'距离下一节课开始'};

  // 今天已放学
  const isSchoolDay = !!WEEK[now.getDay()];
  if(isSchoolDay && t < m(NIGHT_START))
    return {type:'study_start', target: hm(NIGHT_START, now), label:'距离晚自习开始'};

  // 周末 / 放学后：指向下一个上课日的第一节课
  const nxt = upcomingSlots(now, 1)[0];
  if(nxt) return {type:'class', target: nxt.start, slot: nxt, label:'距离下一节课开始'};
  return {type:'rest'};
}

/* 当前是否正在上课 */
function currentSlot(now){
  const list = WEEK[now.getDay()] ? slotsOfDay(now.getDay(), now) : [];
  return list.find(s => now >= s.start && now < s.end) || null;
}

/* ============================================================
   5. 数据层
   ============================================================ */
const state = { data:null, lastFetch:0, timer:null, tick:null };

async function api(path, opt){
  let r;
  try{
    r = await fetch(API+path, Object.assign({cache:'no-store'}, opt||{}));
  }catch(e){
    // 网络层失败 = 本机服务没在运行（区别于服务返回的错误状态）
    const err = new Error('本地服务未运行');
    err.offline = true;
    onServiceLost();
    throw err;
  }
  if(!r.ok) throw new Error('HTTP '+r.status);
  return await r.json();
}

async function loadData(force){
  setStatus('loading');
  try{
    const d = await api('/api/data' + (force?'?fresh=1':''));
    state.data = d; state.lastFetch = Date.now();
    render();
    // 服务端先回了缓存、正在后台抓新的 → 轮询等它抓完再替换（页面已经能看了）
    if(d && d.updating) watchForUpdate();
  }catch(e){
    state.data = {ok:false, offline:true, error:String(e&&e.message||e)};
    render();
  }
}

/* 后台更新看护：数据一变就重绘，抓完自动停 */
let UPDATE_TIMER = null, UPDATE_TRIES = 0;
function watchForUpdate(){
  if(UPDATE_TIMER) return;
  UPDATE_TRIES = 0;
  UPDATE_TIMER = setInterval(async ()=>{
    UPDATE_TRIES++;
    try{
      const d = await api('/api/data');
      const changed = d && d.fetchedAt && (!state.data || d.fetchedAt !== state.data.fetchedAt);
      if(changed){
        state.data = d; state.lastFetch = Date.now();
        render();
      }
      if(!d || !d.updating || UPDATE_TRIES > 40){
        clearInterval(UPDATE_TIMER); UPDATE_TIMER = null;
      }
    }catch(e){
      clearInterval(UPDATE_TIMER); UPDATE_TIMER = null;
    }
  }, 1500);
}

function setStatus(kind){
  const dot = $('#dotStatus'), txt = $('#chipStatus');
  if(kind==='ok'){ dot.className='dot'; txt.textContent='已连接'; }
  else if(kind==='loading'){ dot.className='dot warn'; txt.textContent='读取中'; }
  else if(kind==='warn'){ dot.className='dot warn'; txt.textContent='待登录'; }
  else { dot.className='dot off'; txt.textContent='未连接'; }
}

/* ============================================================
   6. 顶部告警条
   ============================================================ */
let ALERT_SIG = '';

function alertHTML(d){
  const age  = dataAgeText(d);
  const when = dataClock(d);
  const hint = d.hasCreds
    ? '本机已保存凭据、会自动重登；若一直没恢复，就手动登录一次。'
    : '重新登录时勾上「自动重登」，以后掉线本机自己就能救回来。';
  return `<div class="alert">
    <div class="ai">🔐</div>
    <div class="ab">
      <h4>ManageBac 登录已失效</h4>
      <p>电脑上那份登录被 ManageBac 作废了（Cookie 还在，是服务端把会话清了）。
         数据停在 <b>${age}</b>${when ? `（${when} 抓到的）` : ''} —— <b>跟网络和电脑都无关</b>。
         ${hint}</p>
    </div>
    <div class="aa">
      <button id="alertLogin">重新登录</button>
      <button class="ghost2" id="alertHide">先看旧数据</button>
    </div>
  </div>`;
}

function renderAlert(d){
  const box = document.getElementById('alert');
  if(!box) return;
  const show = d && !d.offline && d.sessionExpired && !state.alertHidden;
  if(!show){
    // 关键：只要 DOM 里还有东西就清掉，不能看 ALERT_SIG。
    // 「重新登录」按钮会把 ALERT_SIG 置空；若那一刻数据已经恢复（show=false），
    // 用 ALERT_SIG 当条件就会跳过清空 → 告警条永久钉在页面上，
    // 于是出现「抬头说已连接、下面还挂着登录已失效」的自相矛盾。
    if(box.innerHTML) box.innerHTML = '';
    ALERT_SIG = '';
    return;
  }
  // 同一件事只画一次（render 会被定时器反复调用，别让动画一直闪）
  const sig = 'exp:' + Math.round(d.sessionSince || 0);
  if(sig === ALERT_SIG) return;
  ALERT_SIG = sig;
  box.innerHTML = alertHTML(d);

  const b = document.getElementById('alertLogin');
  if(b) b.onclick = ()=>{
    state.forceLogin = true;
    state.alertHidden = false;
    ALERT_SIG = '';
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  };
  const h = document.getElementById('alertHide');
  if(h) h.onclick = ()=>{ state.alertHidden = true; renderAlert(d); };
}

/* ============================================================
   6. 渲染
   ============================================================ */
function render(){
  const d = state.data;
  const app = $('#app');

  if(!d){
    app.innerHTML = skeleton();
    return;
  }
  if(d.offline){
    setStatus('off');
    $('#sub').textContent = '未连接本地服务';
    renderAlert(null);
    app.innerHTML = offlinePanel(d.error);
    bindOffline();
    return;
  }

  // 掉登录时，手上还有没有能看的数据？
  // 有 → 照常显示（顶部挂告警条），别把整页清空：昨天的作业也还是有用的。
  // 没有 → 只能直接请人登录。
  const hasTasks = !!(d.tasks && d.tasks.length);
  const wantLogin = state.forceLogin ||
                    (d.loggedIn === false && (!d.sessionExpired || !hasTasks));
  if(wantLogin){
    setStatus('warn');
    $('#sub').textContent = d.sessionExpired ? '登录已失效，数据未更新' : 'ManageBac 登录已过期';
    renderAlert(d);
    app.innerHTML = loginPanel();
    bindLogin();
    return;
  }
  if(d.ok === false){
    setStatus('off');
    $('#sub').textContent = '读取数据出错';
    renderAlert(null);
    app.innerHTML = errorPanel(d);
    return;
  }

  renderAlert(d);
  setStatus(d.sessionExpired ? 'warn' : 'ok');
  const tasks = prepare(d.tasks||[]);
  const user  = d.user ? '（'+d.user+'）' : '';
  // 一律用数据自己的时间戳说话（见 dataAgeText 的注释）
  const stamp = d.sessionExpired
      ? ' · 数据停在 ' + dataAgeText(d)
      : (d.stale ? ' · 正在更新…' : ' · 数据 ' + dataAgeText(d));
  $('#sub').textContent = (d.sessionExpired ? '登录已失效' : '已连接 ManageBac') + user + stamp;

  const foldWasOpen = state.foldOpen === true;

  app.innerHTML =
    tasksSection(tasks) +
    scheduleSection() +
    gpaSection(d.classes);

  bindTasks();
  if(foldWasOpen){
    const f = $('#fold'), b = $('#foldBtn');
    if(f && b){
      f.classList.add('open');
      b.setAttribute('aria-expanded','true');
      b.querySelector('.lbl small').textContent = '点按收起';
    }
  }
  startTicking();
  bindScheduleClicks();
  fitAll();
  window.addEventListener('resize', fitAll);
}

function skeleton(){
  let s = '<section><div class="sec-head"><h2>待办事项</h2></div><div class="grid">';
  for(let i=0;i<8;i++) s += '<div class="skeleton"></div>';
  return s + '</div></section>';
}

/* file:// 打开时浏览器（尤其 Safari）不允许直接请求本机服务，
   用一张 1x1 图片探测服务是否在线；在线就转到托管地址，完全无障碍。 */
let PROBE_TIMER = null;
function probeOnce(onUp, onDown){
  const img = new Image();
  const t = setTimeout(()=>{ img.onload=img.onerror=null; onDown && onDown(); }, 2500);
  img.onload = ()=>{ clearTimeout(t); onUp && onUp(); };
  img.onerror = ()=>{ clearTimeout(t); onDown && onDown(); };
  img.src = API + '/api/ping.gif?_=' + Date.now();
}
function startAutoProbe(){
  if(PROBE_TIMER) return;
  PROBE_TIMER = setInterval(()=>{
    probeOnce(()=>{
      clearInterval(PROBE_TIMER); PROBE_TIMER = null;
      location.replace(API + '/app');     // 服务已就绪 → 直接进入看板
    });
  }, 4000);
}

/* ---------- 服务离线看护：断线提示 + 恢复后自动重连 ---------- */
let WATCH_TIMER = null, WATCH_DOWN = false;
function showDownBanner(){
  if(document.getElementById('svcDown')) return;
  const d = document.createElement('div');
  d.id = 'svcDown';
  d.className = 'svc-down';
  d.innerHTML = '<span class="dot"></span>' +
    '<b>本地服务已断开</b>' +
    '<span>请回到桌面双击 <b>ManageBac看板</b> 图标重新启动 —— 这一页会自动恢复，不用手动刷新。</span>';
  document.body.insertBefore(d, document.body.firstChild);
}
function hideDownBanner(){ const e = document.getElementById('svcDown'); if(e) e.remove(); }
function onServiceLost(){ WATCH_DOWN = true; showDownBanner(); startWatchdog(); }
function startWatchdog(){
  if(WATCH_TIMER) return;
  WATCH_TIMER = setInterval(()=>{
    probeOnce(()=>{
      if(WATCH_DOWN){ WATCH_DOWN = false; hideDownBanner(); location.reload(); }
    }, ()=>{
      WATCH_DOWN = true; showDownBanner();
    });
  }, 10000);
}
if(location.protocol === 'file:'){
  probeOnce(()=>{ location.replace(API + '/app'); }, null);
}

function bindLogin(){
  const f = $('#loginForm'); if(!f) return;
  const forget = $('#lgForget');
  if(forget) forget.onclick = async (e)=>{
    e.preventDefault();
    const msg = $('#lgMsg');
    try{
      const r = await api('/api/forget-creds', {method:'POST',
        headers:{'Content-Type':'application/json'}, body:'{}'});
      msg.className = r.ok ? 'msg ok' : 'msg err';
      msg.textContent = r.msg || (r.ok ? '已删除' : '删除失败');
    }catch(err){ msg.className='msg err'; msg.textContent = '删除失败：'+(err&&err.message||err); }
  };
  f.onsubmit = async (e)=>{
    e.preventDefault();
    const btn = $('#lgBtn'), msg = $('#lgMsg');
    btn.disabled = true; btn.textContent = '正在登录…';
    msg.className='msg'; msg.textContent = '正在通过本机浏览器登录 ManageBac，约需 10–20 秒…';
    try{
      const r = await api('/api/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({login:$('#lg').value.trim(), password:$('#pw').value,
                              remember:$('#rm').checked, save:$('#sv').checked})
      });
      if(r.ok){
        msg.className='msg ok';
        msg.textContent = '登录成功，正在读取数据…' +
          (r.saved ? '（已保存凭据，下次掉线会自动重登）'
                   : (r.savedMsg ? '（未保存凭据：'+r.savedMsg+'）' : ''));
        state.forceLogin = false; state.alertHidden = false; ALERT_SIG = '';
        loadData(true);
      }
      else { msg.className='msg err'; msg.textContent = r.msg||'登录失败'; btn.disabled=false; btn.textContent='登录并加载看板'; }
    }catch(err){
      if(err && err.offline){
        msg.className='msg err';
        msg.innerHTML = '连不上本地数据服务。请回到桌面双击 <b>ManageBac看板</b> 图标重新启动，' +
                        '页面会自动恢复，然后再点这里的登录。';
      }else{
        msg.className='msg err'; msg.textContent = '请求失败：'+ (err&&err.message||err);
      }
      btn.disabled=false; btn.textContent='登录并加载看板';
    }
  };
}

/* ---------- 数据整理 ---------- */
function prepare(raw){
  const now = Date.now();
  const list = raw
    .filter(t => !HIDE_TITLE_RE.test(t.title||''))
    .map(t=>{
      const due = t.due ? new Date(t.due) : null;
      const created = t.created ? new Date(t.created) : null;
      const left = due ? due.getTime() - now : null;
      return Object.assign({}, t, {
        dueD: due, createdD: created, leftMs: left,
        subj: shortSubject(t.subject),
        isOver: (t.view==='overdue') || (left!==null && left<0)
      });
    });
  const upcoming = list.filter(t=>!t.isOver)
    .sort((a,b)=> (b.createdD?b.createdD.getTime():0) - (a.createdD?a.createdD.getTime():0));
  const overdue  = list.filter(t=>t.isOver)
    .sort((a,b)=> (b.dueD?b.dueD.getTime():0) - (a.dueD?a.dueD.getTime():0));
  return {upcoming, overdue};
}

/* ---------- 待办 ---------- */
function taskCard(t){
  const cls = t.isOver ? 'r-over'
    : (t.leftMs!==null && t.leftMs <= T_URGENT*3600e3) ? 'r-urgent'
    : (t.leftMs!==null && t.leftMs <= T_SOON*3600e3)   ? 'r-soon'
    : (t.leftMs!==null && t.leftMs <= T_BLUE*3600e3)   ? 'r-blue'
    : 'r-ok';
  const leftTxt = t.isOver
    ? (t.dueD ? '已逾期 ' + humanLeft(Date.now()-t.dueD.getTime()) : '已逾期')
    : (t.leftMs!==null ? '剩 ' + humanLeft(t.leftMs) : '未设置截止');
  const pub = t.createdD ? fmtDate(t.createdD) : '—';
  const dueTxt = t.dueD ? fmtDateClock(t.dueD) : (t.dueText||'—');
  const href = MB + t.url;
  return `<a class="task ${cls}" href="${esc(href)}" target="_blank" rel="noopener"
             title="${esc(t.subject)} — ${esc(t.title)}">
    <div class="top">
      <div class="subject" style="color:${subjectColor(t.subject, t.subj)}" title="${esc(t.subject)}">${esc(t.subj)}</div>
      <div class="kind">${esc(t.type||'')}</div>
    </div>
    <div class="title"><span data-title>${esc(t.title||'')}</span></div>
    <div class="foot">
      <div class="row"><span class="k">发布</span><span class="v">${esc(pub)}</span></div>
      <div class="row"><span class="k">截止</span><span class="v">${esc(dueTxt)}</span></div>
      <div class="row"><span class="k"></span><span class="v t-left">${esc(leftTxt)}</span></div>
    </div>
  </a>`;
}

function tasksSection(t){
  const up = t.upcoming, od = t.overdue;
  let html = `<section>
    <div class="sec-head">
      <h2>待办事项</h2>
      <span class="count">${up.length} 项待完成${od.length?' · '+od.length+' 项已逾期':''}</span>
    </div>`;
  html += up.length
    ? `<div class="grid">${up.map(taskCard).join('')}</div>`
    : `<div class="panel" style="padding:26px"><p>🎉 没有待完成的作业了</p></div>`;

  if(od.length){
    html += `<div class="fold" id="fold">
      <button class="fold-btn" id="foldBtn" aria-expanded="false">
        <span class="sw">${od.length}</span>
        <span class="lbl">已逾期项目 <small>点按查看</small></span>
        <span class="chev"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 5.2 7 9.2l4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </button>
      <div class="fold-body" id="foldBody">
        <div class="grid">${od.map(taskCard).join('')}</div>
      </div>
    </div>`;
  }
  return html + '</section>';
}

function bindTasks(){
  const btn = $('#foldBtn'); if(!btn) return;
  btn.onclick = ()=>{
    const f = $('#fold'); const open = f.classList.toggle('open');
    state.foldOpen = open;
    btn.setAttribute('aria-expanded', open ? 'true':'false');
    btn.querySelector('.lbl small').textContent = open ? '点按收起' : '点按查看';
    if(open) setTimeout(fitAll, 60);
  };
}

/* ---------- 课表 ---------- */
function scheduleSection(){
  return `<section>
    <div class="sec-head">
      <h2>接下来的课程</h2>
      <span class="count" id="dayLabel"></span>
    </div>
    <div class="count-card" id="countCard"></div>
    <div class="classes" id="classes"></div>
  </section>`;
}

function tick(){
  const now = new Date();
  const t = nextTarget(now);

  const cur = currentSlot(now);
  const card = $('#countCard'); if(!card) return;

  let big, label = t.label || '', targetName = '', where = '', pct = 0, rest = false;
  if(t.type === 'rest'){
    rest = true; big = '好好休息'; label = '现在是休息时间';
  }else{
    const left = Math.max(0, t.target.getTime() - now.getTime());
    big = hms(left);
    if(t.type === 'class'){
      const s = t.slot;
      targetName = s.subject;
      where = (s.room? s.room+' · ':'') + s.teacher + (s.mode? ' · '+s.mode : '');
      const span = t.target.getTime() - now.getTime();
      pct = 0;
    }else if(t.type === 'study_end'){
      const start = hm(NIGHT_START, now).getTime();
      pct = Math.max(0, Math.min(100, (now.getTime()-start)/(t.target.getTime()-start)*100));
    }else{
      targetName = '晚自习';
      const start = hm(PERIODS[5].e, now).getTime();
      pct = Math.max(0, Math.min(100, (now.getTime()-start)/(t.target.getTime()-start)*100));
    }
  }

  card.innerHTML = `
    <div class="count-label">${esc(label)}</div>
    <div class="count-big ${rest?'rest':''}">${esc(big)}</div>
    ${targetName?`<div class="count-target">
        <span class="name">${esc(targetName)}</span>
        ${where?`<span class="where">${esc(where)}</span>`:''}
        ${t.type==='class'?`<span class="where">${esc(t.slot.pLabel+' '+fmtClock(t.slot.start)+'–'+fmtClock(t.slot.end))}</span>`:''}
      </div>`:''}
    ${t.type!=='rest'?`<div class="progress"><i style="width:${pct.toFixed(1)}%"></i></div>`:''}
    ${cur?`<div class="now-line">正在上课：${esc(cur.subject)} · ${esc(cur.room||'')} ${esc(cur.teacher)}（${esc(fmtClock(cur.start)+'–'+fmtClock(cur.end))}）</div>`:''}
  `;

  // 课程列表
  const slots = upcomingSlots(now, 4);
  let n = 3;
  if(slots[2] && slots[3] && slots[2].blockId === slots[3].blockId) n = 4;
  const chosen = slots.slice(0, n);

  // 合并连堂 → 卡片
  const cards = [];
  chosen.forEach(s=>{
    const last = cards[cards.length-1];
    if(last && last.blockId === s.blockId){ last.to = s.period; last.end = s.end; return; }
    cards.push(Object.assign({}, s, {to:s.period}));
  });

  const box = $('#classes');
  box.innerHTML = cards.map(s=>{
    const sameDay = s.start.toDateString() === now.toDateString();
    const pr = s.span[0] === s.span[1] ? 'P'+s.span[0] : 'P'+s.span[0]+'–P'+s.span[1];
    const time = sameDay
      ? fmtClock(s.start)+'–'+fmtClock(s.end)
      : (s.start.getMonth()+1)+'/'+s.start.getDate()+' '+fmtClock(s.start)+'–'+fmtClock(s.end);
    return `<div class="cls" style="--pc:${s.color||'var(--accent)'}">
      <div class="p"><span>${pr}</span><span class="tt">${esc(time)}</span></div>
      <div class="n ${s.isFree?'free':''}">${esc(s.subject)}</div>
      <div class="m">
        ${s.isFree ? '<span style="color:var(--ink3)">没有安排课程</span>' : `<div>
          ${s.room?`<span class="tag">${esc(s.room)}</span>`:''}
          <span class="tag ${s.mode==='走班'?'walk':(s.mode==='本班'?'own':'')}">${esc(s.mode||'')}</span>
          <span>${esc(s.teacher)}</span>
        </div>`}
      </div>
    </div>`;
  }).join('');

  const dl = $('#dayLabel');
  if(dl && chosen.length){
    const f = chosen[0];
    const wd = ['周日','周一','周二','周三','周四','周五','周六'][f.start.getDay()];
    dl.textContent = (f.start.getMonth()+1)+'月'+f.start.getDate()+'日 '+wd+' · 接下来 '+n+' 节课';
  }
}

function startTicking(){
  if(state.tick) clearInterval(state.tick);
  state.tick = setInterval(tick, 1000);
  tick();
}

/* ---------- GPA 总览（新增） ---------- */
/* 学科配色：莫兰迪色系（低饱和 + 中等偏深），一个学科一个颜色。
   待办卡片的学科名、GPA 柱状图的柱子、作业小模块的学科标签，三处共用同一套色。 */
const SUBJ_COLOR = {
  chinese:'#a96f6b', math:'#867a9e', ela:'#b58455', chem:'#6f7c9e',
  phys:'#719070',    bio:'#5b918a',  geo:'#74889c', ids:'#94836f'
};
/* 学科槽位识别（与后端 scrape.js 同一套正则，按顺序匹配，先命中先算） */
const SUBJ_SLOTS = [
  ['chinese', /chinese|语文|中文/i],
  ['math',    /pre-?calculus|calculus|\bmath/i],
  ['ela',     /english/i],
  ['chem',    /chem/i],
  ['phys',    /physic/i],
  ['bio',     /biolog/i],
  ['geo',     /geograph/i],
  ['ids',     /\bIDS\b|big\s*history/i]
];
function subjectKey(){
  const t = Array.prototype.slice.call(arguments).join(' ');
  for(const s of SUBJ_SLOTS){ if(s[1].test(t)) return s[0]; }
  return '';
}
function subjectColor(){
  return SUBJ_COLOR[subjectKey.apply(null, arguments)] || 'var(--accent)';
}
/* 折算成满分 4 分：99.2% → 3.97 */
function to4(ratio){ return (Math.round(ratio*400)/100).toFixed(2); }

function gpaSection(classes){
  const list = Array.isArray(classes) ? classes : [];
  if(!list.length){
    return `<section>
      <div class="sec-head"><h2>GPA 总览</h2><span class="count">各科 Overall 成绩</span></div>
      <div class="panel" style="padding:24px"><p style="color:var(--ink2);font-size:14px;margin:0">
        本次数据里还没有成绩信息，点右上角「刷新」重新读取一次即可。</p></div>
    </section>`;
  }

  const cols = list.map(c=>{
    const ov = c.overall || {};
    const has = typeof ov.pct === 'number' && !isNaN(ov.pct);
    const color = SUBJ_COLOR[c.key] || 'var(--accent)';
    const pct = has ? Math.max(0, Math.min(100, ov.pct)) : 0;
    const href = MB + (c.url || '');
    return `<a class="gpa-col" href="${esc(href)}" target="_blank" rel="noopener"
               title="${esc(c.label)} · ${esc(c.name||'')}${has?(' — Overall '+ov.pct+'%'):' — 暂无成绩'}">
      <div class="gpa-top">
        <div class="gpa-pct" style="color:${has?color:'var(--ink3)'}">${has ? fmtPct(ov.pct) : '—'}</div>
        ${has?`<div class="gpa-4" style="color:${color}">${to4(ov.pct/100)} / 4.0</div>`:''}
        <div class="gpa-grade ${has && ov.mark ? '' : 'none'}">${esc(ov.mark || (has ? '' : '未出分'))}</div>
      </div>
      <div class="gpa-track ${has?'':'empty'}">
        ${has?`<div class="gpa-fill" style="height:${pct.toFixed(1)}%;background:${color}"></div>`:''}
      </div>
      <div class="gpa-name">${esc(c.label)}</div>
    </a>`;
  }).join('');

  const hws = list.map(c=>{
    const h = c.latest;
    const href = MB + (c.url || '');
    const cColor = SUBJ_COLOR[c.key] || 'var(--ink3)';
    if(!h){
      return `<a class="hw none" href="${esc(href)}" target="_blank" rel="noopener"
                 title="${esc(c.label)} — 暂无已评分作业"><span class="hw-sub" style="color:${cColor}">${esc(c.label)}</span><br>暂无已评分作业</a>`;
    }
    const g = (h.grade||'').trim();
    const low = /^[CD]/.test(g);
    const due = h.dueText || '';
    return `<a class="hw" href="${esc(MB + (h.url||c.url||''))}" target="_blank" rel="noopener"
               title="${esc(c.label)} · ${esc(h.title||'')}">
      <div class="hw-sub" style="color:${cColor}">${esc(c.label)}</div>
      <div class="hw-name">${esc(h.title||'作业')}</div>
      <div class="hw-foot">
        <div class="hw-due">${esc(shortDue(due))}</div>
        <div class="hw-score">${g?`<span class="g ${low?'low':''}">${esc(g)}</span>`:''}${esc(h.scoreText||'')}</div>
      </div>
    </a>`;
  }).join('');

  const graded = list.filter(c=>c.overall && typeof c.overall.pct === 'number');
  const avg = graded.length ? graded.reduce((s,c)=>s+c.overall.pct,0)/graded.length : null;

  return `<section>
    <div class="sec-head">
      <h2>GPA 总览</h2>
      <span class="count">${graded.length}/${list.length} 门已出分${avg!==null?` · 均分 ${fmtPct(avg)}（${to4(avg/100)} / 4.0）`:''}</span>
    </div>
    <div class="panel gpa-panel">
      <div class="gpa-chart">${cols}</div>
      <div class="gpa-latest">${hws}</div>
    </div>
  </section>`;
}

/* 截止时间简化显示：'Sep 14 Monday at 10:20 AM' → '9/14 10:20' */
function shortDue(s){
  const t = String(s||'');
  const m = /([A-Z][a-z]{2})\w*\s+(\d{1,2})\s+\w+\s+at\s+(\d{1,2}):(\d{2})\s*(AM|PM)/.exec(t);
  if(m){
    const mo = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12}[m[1]];
    let h = parseInt(m[3],10)%12; if(m[5]==='PM') h+=12;
    return mo+'/'+parseInt(m[2],10)+' '+String(h).padStart(2,'0')+':'+m[4];
  }
  return t.replace(/\bat\b/i,'').replace(/\s+/g,' ').trim();
}

function fmtPct(v){
  const n = Number(v);
  if(isNaN(n)) return '—';
  // 统一成最多两位小数，并去掉多余的 0：99.20→99.2、78.00→78、80.89→80.89
  const s = (Math.round(n*100)/100).toFixed(2).replace(/\.?0+$/,'');
  return s + '%';
}

/* 点击课表卡片 / 倒计时卡片 → 打开桌面上的课表 PDF */
function openSchedule(e){
  if(e) e.preventDefault();
  let done = false;
  const fallback = ()=>{
    if(done) return; done = true;
    window.open(API + '/schedule.pdf', '_blank');
  };
  fetch(API + '/api/open-schedule', {
    method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'
  }).then(r=>r.json()).then(j=>{
    if(!j || !j.ok) fallback();
  }).catch(fallback);
}

function bindScheduleClicks(){
  ['#countCard','#classes'].forEach(sel=>{
    const el = $(sel);
    if(!el || el.dataset.clickBound) return;
    el.dataset.clickBound = '1';
    el.classList.add('sched-click');
    el.addEventListener('click', openSchedule);
  });
}

/* ---------- 字号自适应 ---------- */
function fitAll(){
  document.querySelectorAll('[data-title]').forEach(el=>{
    const box = el.parentElement;                 // .title 容器
    const maxH = box ? box.clientHeight : el.clientHeight;
    if(!maxH) return;
    let size = 17;
    el.style.fontSize = size+'px';
    // 逐档缩小直到内容不超过容器高度
    for(let i=0;i<24;i++){
      if(el.scrollHeight <= maxH + 0.5) break;
      size -= 0.5;
      el.style.fontSize = size+'px';
      if(size <= 11.5) break;
    }
  });
}
