<div id="app">
  <header class="titlebar">
    <span class="tb-title" id="tbTitle">ManageBac-Buddy</span>
    <span class="spacer"></span>
  </header>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <main class="main">
      <div class="head" id="head"></div>
      <div class="scroll" id="scroll"><div class="sections" id="sections"></div></div>
    </main>
  </div>
</div>

<!-- 登录 / 重新登录 -->
<div class="overlay" id="overlay" hidden>
  <div class="card login-card">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="brand" style="padding:0"><div class="logo">📂</div></div>
      <div>
        <h3>登录 ManageBac</h3>
      </div>
    </div>
    <p id="loginHint">看板需要一次登录才能读取你的作业与成绩。登录信息只在这台电脑上用于抓取，密码可选地加密保存在本机。</p>
    <div class="field"><label for="fLogin">账号（学号 / 邮箱）</label><input id="fLogin" autocomplete="username"></div>
    <div class="field"><label for="fPass">密码</label><input id="fPass" type="password" autocomplete="current-password"></div>
    <label class="checkline"><input type="checkbox" id="fSave"> 在本机保存账号密码，掉登录时自动重登</label>
    <div class="msg" id="loginMsg"></div>
    <div class="login-actions">
      <button class="btn primary" id="btnLogin"><svg><use href="#i-check"/></svg>登录</button>
      <button class="btn ghost" id="btnBrowser">用浏览器登录</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
